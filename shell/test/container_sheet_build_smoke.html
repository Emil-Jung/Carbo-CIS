<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Container sheet build smoke</title>
</head>
<body>
  <pre id="out">Running…</pre>
  <script src="../modules/container_manifest.js"></script>
  <script>
    (function () {
      var manifest = {
        header: {
          container_number: "GAOU6688205",
          product_key: "LF2.5",
          product_label: "Pallet — LF2.5 (Le Fournaise — 2.5 kg retail bag)",
          ship_to: "Rotterdam",
          booking_ref: "EBKG19038595",
          delivery_note: "DN-1",
          transporter: "TransCo",
          tag_ref: "REG-99",
        },
        summary: { qty_bags: 800, weight_loaded_kg: 77400, tare_kg: 3840, total_kg: 81240 },
        lines: [
          {
            supplier: "Unknown producer 387",
            weight_kg: 387,
            product_stream: "lumpwood",
          },
          {
            supplier: "Farm A",
            weight_kg: 387,
            product_stream: "pallet",
          },
          {
            supplier: "Unknown producer 388",
            weight_kg: 388,
            product_stream: "pallet",
          },
        ],
      };
      var html = window.CIS.buildContainerManifestHtml(manifest, "general", {});
      var entries = CIS.containerSheetLoadingEntries(manifest);
      var ok =
        html.indexOf("GAOU6688205") !== -1 &&
        html.indexOf("DOM2.5") !== -1 &&
        html.indexOf("LF2.5") === -1 &&
        html.indexOf("Unknown producer") === -1 &&
        html.indexOf("Farm A") === -1 &&
        html.indexOf("Loading Team") !== -1 &&
        html.indexOf("REG") !== -1 &&
        entries.length === 2 &&
        html.indexOf("387") !== -1 &&
        html.indexOf("window.print") === -1;
      document.getElementById("out").textContent = ok
        ? "PASS: paper layout, DOM2.5 map, pallet-only rows (2), no producer text."
        : "FAIL";
    })();
  </script>
</body>
</html>
