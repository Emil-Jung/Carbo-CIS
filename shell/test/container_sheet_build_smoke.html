<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Container sheet build smoke</title>
</head>
<body>
  <pre id="out">Running…</pre>
  <script src="../modules/container_manifest.js"></script>
  <script>
    (function () {
      var rows = [];
      for (var i = 1; i <= 48; i++) {
        var n = String(5658 + i).padStart(6, "0");
        rows.push({
          serial: "BAG-2026-" + n,
          net_weight_kg: 387,
          status_changed_at: "2026-10-20T12:00:0" + (i % 10) + "Z",
        });
      }
      var manifest = {
        header: {
          container_number: "GAOU6688205",
          product_key: "LF2.5",
          product_label: "Pallet — LF2.5 (Le Fournaise — 2.5 kg retail bag)",
          ship_to: "Rotterdam",
          booking_ref: "EBKG19038595",
        },
        summary: { qty_bags: 48, weight_loaded_kg: 48 * 387, tare_kg: 3840 },
        lines: [
          {
            bag_identifier: "BAG-2026-005659",
            weight_kg: 387,
            supplier: "Unknown producer 387",
            product_stream: "lumpwood",
          },
        ],
        _sheet_loading_rows: rows,
      };
      var html = CIS.buildContainerManifestHtml(manifest, "general", {});
      var entries = CIS.containerSheetLoadingEntries(manifest);
      var ok =
        html.indexOf("GAOU6688205") !== -1 &&
        html.indexOf("DOM2.5") !== -1 &&
        html.indexOf("LF2.5") === -1 &&
        html.indexOf("Unknown producer") === -1 &&
        html.indexOf("BAG-2026-005659") !== -1 &&
        entries.length === 48 &&
        html.indexOf("window.print") === -1;
      document.getElementById("out").textContent = ok
        ? "PASS: 48 bag rows, BAG IDs in sheet, no producer placeholders."
        : "FAIL entries=" + entries.length;
    })();
  </script>
</body>
</html>
