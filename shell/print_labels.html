<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="theme-color" content="#f0f0f0" />
  <title>Carbo Print Labels</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/print_labels-icon-32.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/print_labels-icon-192.png" />
  <link rel="stylesheet" href="print_labels_theme.css?v=1.9.8-a4-pdf-progress" />
</head>
<body class="print-labels-app">
  <div id="pl-browser-trap" class="print-labels-browser-trap hidden" role="alert">
    <div class="print-labels-browser-trap__card">
      <h2>Close this browser tab</h2>
      <div class="print-labels-browser-trap__body">
        <p>Print Labels cannot access your Zebra from Chrome or Edge. Use <strong>Start → Carbo Print Labels</strong>.</p>
      </div>
    </div>
  </div>
  <div class="print-labels-shell">
  <div id="login-view" class="login-view hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-logo-wrap">
        <img class="login-logo" src="assets/logo.png" alt="Carbo" width="92" height="92" />
      </div>
      <h1 class="brand">Print Labels</h1>
      <p class="subtitle">Bag label printer · sign in with your CIS user ID</p>
      <label for="login-id">User ID</label>
      <input id="login-id" name="username" type="text" autocomplete="username" required />
      <label for="login-password">Password</label>
      <div class="password-field">
        <input id="login-password" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required />
        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
          <svg class="password-toggle__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 11.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><span class="password-toggle__text">Show</span>
        </button>
      </div>
      <button type="submit" id="login-btn">Sign in</button>
      <p id="login-build-hint" class="print-labels-login-build muted" aria-live="polite"></p>
      <p id="login-error" class="login-error hidden"></p>
    </form>
  </div>

  <div id="setup-view" class="login-view hidden">
    <form id="setup-form" class="login-card" autocomplete="on">
      <div class="login-logo-wrap">
        <img class="login-logo" src="assets/logo.png" alt="Carbo" width="92" height="92" />
      </div>
      <h1 class="brand">Welcome</h1>
      <p class="subtitle">Create your password to sign in</p>
      <p class="setup-user-id">User ID: <strong id="setup-login-id"></strong></p>
      <label for="setup-password">New password (min 6 characters)</label>
      <div class="password-field">
        <input id="setup-password" name="new-password" type="password" autocomplete="new-password" required />
        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
          <svg class="password-toggle__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 11.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
        </button>
      </div>
      <label for="setup-password2">Confirm password</label>
      <div class="password-field">
        <input id="setup-password2" name="confirm-password" type="password" autocomplete="new-password" required />
        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
          <svg class="password-toggle__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 11.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
        </button>
      </div>
      <button type="submit" id="setup-btn">Create password & sign in</button>
      <button type="button" id="setup-back-btn" class="btn-ghost setup-back">Back to sign in</button>
      <p id="setup-error" class="login-error hidden"></p>
    </form>
  </div>

  <div id="app-view" class="app-view hidden">
    <header class="topbar print-labels-topbar">
      <div class="topbar-left">
        <div class="topbar-brand-wrap">
          <img class="topbar-logo print-labels-logo" src="assets/logo.png" alt="Carbo" width="48" height="48" />
          <div class="print-labels-brand-stack">
            <span class="topbar-brand">Print Labels</span>
            <span class="print-labels-app-tag">Production utility</span>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <span id="current-user" class="print-labels-meta print-labels-meta--user"></span>
        <button id="logout-btn" class="btn-ghost">Sign out</button>
      </div>
    </header>
    <div class="body">
      <main id="module-content" class="module-content"></main>
    </div>
    <footer class="print-labels-footer" aria-label="Application status">
      <span id="app-version" class="print-labels-footer__version"></span>
      <span class="print-labels-footer__brand">Carbo Print Labels</span>
    </footer>
  </div>
  </div>

  <script>window.CIS_IS_PRINT_LABELS_APP = true;</script>
  <script src="auth.js?v=1.0.2-pwd-toggle"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="modules/cis_helpers.js?v=1.4.3"></script>
  <script src="modules/label_zpl.js?v=1.9.3-ydown3mm"></script>
  <script src="modules/print_labels.js?v=1.9.9-a4-qr-fix"></script>
  <script src="print_labels_app.js?v=1.8.2-frame"></script>
</body>
</html>
