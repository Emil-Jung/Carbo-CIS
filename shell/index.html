<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#0c0c0c" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

  <title>Carbo Integrated System</title>

  <link rel="manifest" href="manifest.json" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />

  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <link rel="stylesheet" href="styles.css?v=1.6.52" />

</head>

<body>

  <!-- Login view -->

  <div id="login-view" class="login-view hidden">

    <form id="login-form" class="login-card" autocomplete="on">

      <div class="login-logo-wrap">

        <img class="login-logo" src="assets/logo.png" alt="Carbo" width="92" height="92" />

      </div>

      <h1 class="brand">Carbo Integrated System</h1>

      <p class="subtitle">Sign in to continue</p>

      <label for="login-id">User ID</label>

      <input id="login-id" name="username" type="text" autocomplete="username" required />

      <label for="login-password">Password</label>

      <div class="password-field">
        <input id="login-password" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required />
        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
          <svg class="password-toggle__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 11.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
        </button>
      </div>

      <button type="submit" id="login-btn">Sign in</button>

      <p id="login-error" class="login-error hidden"></p>
      <p class="login-hint muted">First time? Use the link your administrator sent — it includes your User ID.</p>
    </form>
  </div>

  <!-- First sign-in: create password -->
  <div id="setup-view" class="login-view hidden">
    <form id="setup-form" class="login-card" autocomplete="on">
      <div class="login-logo-wrap">
        <img class="login-logo" src="assets/logo.png" alt="Carbo" width="92" height="92" />
      </div>
      <h1 class="brand">Welcome</h1>
      <p class="subtitle">Create your password to sign in</p>
      <p class="setup-user-id">User ID: <strong id="setup-login-id"></strong></p>
      <label for="setup-password">New password (min 6 characters)</label>
      <div class="password-field">
        <input id="setup-password" name="new-password" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" required />
        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
          <svg class="password-toggle__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 11.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
        </button>
      </div>
      <label for="setup-password2">Confirm password</label>
      <div class="password-field">
        <input id="setup-password2" name="confirm-password" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" required />
        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
          <svg class="password-toggle__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 11.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
        </button>
      </div>
      <button type="submit" id="setup-btn">Create password & sign in</button>
      <button type="button" id="setup-back-btn" class="btn-ghost setup-back">Back to sign in</button>
      <p id="setup-error" class="login-error hidden"></p>
    </form>
  </div>

  <!-- App shell -->

  <div id="app-view" class="app-view hidden">

    <header class="topbar">

      <div class="topbar-left">

        <button type="button" id="back-btn" class="btn-ghost btn-back hidden" title="Back to dashboard" aria-label="Back to dashboard">← Back</button>

        <div class="topbar-brand-wrap">

          <img class="topbar-logo" src="assets/logo.png" alt="Carbo" width="72" height="72" />

          <span class="topbar-brand">Carbo Integrated System</span>

        </div>

      </div>

      <div class="topbar-center">

        <span id="topbar-context" class="topbar-context">Dashboard</span>

      </div>

      <div class="topbar-right">

        <span id="app-version" class="current-user"></span>

        <span id="current-user" class="current-user"></span>

        <button id="logout-btn" class="btn-ghost">Sign out</button>

      </div>

    </header>

    <div class="body">

      <main id="module-content" class="module-content"></main>

    </div>

    <nav id="cis-float-nav" class="cis-float-nav hidden" aria-label="Quick navigation"></nav>

  </div>



  <script src="auth.js?v=1.0.1"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="modules/cis_helpers.js?v=1.4.3"></script>
  <script src="modules/dashboard.js?v=1.6.8"></script>
  <script src="modules/identity_admin.js?v=1.4.0"></script>
  <script src="modules/device_keys.js"></script>
  <script src="modules/quality_capture.js"></script>
  <script src="modules/quality_view.js"></script>
  <script src="modules/producers_office.js"></script>
  <script src="modules/producers_view.js"></script>
  <script src="modules/permit_status.js?v=1.3.39"></script>
  <script src="modules/traceability.js?v=1.6.4"></script>
  <script src="modules/pallet_configuration.js?v=1.0.0"></script>
  <script src="modules/labels_hub.js?v=1.0.0"></script>
  <script src="modules/control_room.js?v=1.0.1"></script>
  <script src="modules/label_zpl.js?v=1.5.15"></script>
  <script src="modules/print_labels.js?v=1.6.5"></script>
  <script src="modules/label_deployment.js?v=1.2.0"></script>
  <script src="modules/manager_override.js?v=1.0.0"></script>
  <script src="modules/maintenance_manager.js"></script>
  <script src="modules/maintenance_certs.js"></script>
  <script src="modules/maintenance_ops.js?v=1.1.0"></script>
  <script src="modules/consumption.js?v=1.3.38"></script>
  <script src="modules/restaurant_report.js?v=1.0.0"></script>
  <script src="modules/bags_movement_report.js?v=1.6.13"></script>
  <script src="modules/bags_status.js?v=1.6.16"></script>
  <script src="modules/containers.js?v=1.0.0"></script>
  <script src="modules/movement_schedule.js?v=1.0.0"></script>
  <script src="modules/supplier_contacts.js?v=1.0.0"></script>

  <script src="app.js?v=1.4.5"></script>

</body>

</html>
